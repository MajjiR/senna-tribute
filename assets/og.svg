<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <filter id="og-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.953  0 0 0 0 0.937  0 0 0 0 0.894  1.4 1.4 1.4 0 -2.15"/>
    </filter>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F4B"/>
      <stop offset="0.6" stop-color="#07110D"/>
    </linearGradient>
    <clipPath id="og-clip"><rect width="1200" height="630"/></clipPath>
  </defs>
  <g clip-path="url(#og-clip)">
    <rect width="1200" height="630" fill="url(#og-bg)"/>
    <!-- diagonal flag-colour bands -->
    <path d="M900 0 H990 L750 630 H660 Z" fill="#00A651"/>
    <path d="M990 0 H1040 L800 630 H750 Z" fill="#FFDF00"/>
    <path d="M1040 0 H1066 L826 630 H800 Z" fill="#1B4FD8"/>
    <g stroke="#F3EFE4" stroke-width="1" opacity="0.35">
      <path d="M1096 0 L856 630 M1112 0 L872 630 M1128 0 L888 630"/>
    </g>
    <!-- car silhouette, large and cropped on the right -->
    <g transform="translate(280 180) scale(0.72)">
      <g fill="#07110D" opacity="0.55" transform="translate(14 14)"><ellipse cx="800" cy="446" rx="720" ry="10"/></g>
      <defs>
    <!-- knock-outs: tyre halos and panel lines cut out of the body so the shape reads as a single flat colour -->
    <mask id="og-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="1600" height="480">
      <rect width="1600" height="480" fill="#fff"/>
      <circle cx="375" cy="340" r="109" fill="#000"/>
      <circle cx="1300" cy="330" r="119" fill="#000"/>
      <g fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <!-- sidepod -->
        <path d="M704 418 L712 336 Q716 310 746 308 L1120 318 Q1168 324 1186 372"/>
        <path d="M730 330 L730 400"/>
        <!-- tub / nose joints -->
        <path d="M566 270 L574 418"/>
        <path d="M236 334 L240 384"/>
        <!-- engine cover -->
        <path d="M936 166 Q950 240 946 312"/>
        <path d="M1090 216 L1104 316"/>
        <!-- rear wing elements -->
        <path d="M1414 150 Q1472 178 1526 142"/>
        <path d="M1414 176 Q1470 202 1526 170"/>
        <path d="M1416 300 L1524 300"/>
        <!-- front wing endplate -->
        <path d="M100 414 L256 410"/>
      </g>
    </mask>
  </defs>

  <g class="silhouette" fill="#F3EFE4">
    <g mask="url(#og-cut)">
      <!-- main body: needle nose, tub, cockpit lip, roll hoop / airbox, engine cover, gearbox, floor -->
      <path d="M108 372 Q103 366 112 363 C200 345 300 318 375 300 C470 280 560 268 640 262 C652 258 662 240 676 236 L684 238 L694 260 L850 252 C862 215 872 180 892 168 L935 164 C990 172 1040 192 1090 214 C1200 262 1320 296 1404 318 L1404 384 L1340 396 L1215 418 L520 418 L500 398 C380 392 220 384 108 372 Z"/>
      <!-- plain helmet dome -->
      <circle cx="770" cy="234" r="43"/>
      <!-- front wing endplate + stay -->
      <path d="M82 406 L112 388 L262 384 L266 428 L82 428 Z"/>
      <path d="M184 372 L206 375 L206 392 L184 392 Z"/>
      <!-- rear wing endplate -->
      <path d="M1404 130 L1538 122 L1538 292 L1512 348 L1404 348 Z"/>
    </g>
    <!-- tyres (annulus) and hubs -->
    <path fill-rule="evenodd" d="M275 340 a100 100 0 1 0 200 0 a100 100 0 1 0 -200 0 Z M323 340 a52 52 0 1 0 104 0 a52 52 0 1 0 -104 0 Z"/>
    <path fill-rule="evenodd" d="M1190 330 a110 110 0 1 0 220 0 a110 110 0 1 0 -220 0 Z M1244 330 a56 56 0 1 0 112 0 a56 56 0 1 0 -112 0 Z"/>
    <circle cx="375" cy="340" r="11"/>
    <circle cx="1300" cy="330" r="12"/>
  </g>

  <g class="detail" fill="none" stroke="#F3EFE4" stroke-width="2.5" stroke-linecap="round">
    <!-- front rim -->
    <circle cx="375" cy="340" r="43"/>
    <circle cx="375" cy="340" r="22"/>
    <path d="M375 318 V297 M375 362 V383 M394 329 L412.2 318.5 M394 351 L412.2 361.5 M356 329 L337.8 318.5 M356 351 L337.8 361.5"/>
    <!-- rear rim -->
    <circle cx="1300" cy="330" r="47"/>
    <circle cx="1300" cy="330" r="24"/>
    <path d="M1300 306 V283 M1300 354 V377 M1320.8 318 L1340.7 306.5 M1320.8 342 L1340.7 353.5 M1279.2 318 L1259.3 306.5 M1279.2 342 L1259.3 353.5"/>
    <!-- aerial -->
    <path d="M590 266 L582 214"/>
  </g>

    </g>
    <path d="M0 0 H1200 V8 H0 Z" fill="#FFDF00"/>
    <g font-family="'Helvetica Neue', Arial, sans-serif" fill="#F3EFE4">
      <text x="64" y="118" font-size="84" font-weight="900" letter-spacing="10">AYRTON</text>
      <text x="64" y="204" font-size="84" font-weight="900" letter-spacing="10" fill="#FFDF00">SENNA</text>
      <text x="66" y="566" font-size="30" font-weight="800" letter-spacing="9">1960–1994</text>
      <text x="330" y="566" font-size="18" font-weight="700" letter-spacing="6">AN UNOFFICIAL FAN TRIBUTE</text>
      <rect x="66" y="522" width="230" height="3" fill="#00A651"/>
    </g>
    <rect width="1200" height="630" filter="url(#og-grain)" opacity="0.4"/>
  </g>
</svg>
