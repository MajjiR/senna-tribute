<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="portrait-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="11"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.953  0 0 0 0 0.937  0 0 0 0 0.894  1.4 1.4 1.4 0 -2.15"/>
    </filter>
    <clipPath id="portrait-clip"><rect width="800" height="1000"/></clipPath>
    <linearGradient id="portrait-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07110D"/><stop offset="0.45" stop-color="#0B1F4B"/><stop offset="0.66" stop-color="#1B4FD8" stop-opacity="0.55"/><stop offset="0.66" stop-color="#0B1F4B"/>
    </linearGradient>
    <linearGradient id="portrait-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1F4B"/><stop offset="1" stop-color="#07110D"/>
    </linearGradient>
    <radialGradient id="portrait-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFDF00" stop-opacity="0.55"/><stop offset="1" stop-color="#FFDF00" stop-opacity="0"/>
    </radialGradient>
    <filter id="portrait-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <g clip-path="url(#portrait-clip)">
    <rect width="800" height="1000" fill="#0B1F4B"/>
    <rect width="800" height="1000" fill="url(#portrait-sky)"/>
    <circle cx="400" cy="560" r="420" fill="url(#portrait-glow)"/>
    <circle cx="400" cy="560" r="150" fill="#FFDF00" filter="url(#portrait-soft)"/>
    <g fill="none" stroke="#F3EFE4" stroke-width="1" opacity="0.28">
      <circle cx="400" cy="560" r="212"/><circle cx="400" cy="560" r="300" stroke-dasharray="2 10"/>
      <path d="M400 110 V330 M60 120 H180 M620 120 H740"/>
    </g>
    <rect y="660" width="800" height="340" fill="url(#portrait-sea)"/>
    <rect y="659" width="800" height="2" fill="#FFDF00" opacity="0.7"/>
    <g fill="#FFDF00"><rect x="250" y="672" width="300" height="5" opacity="0.9"/><rect x="265" y="690" width="270" height="4" opacity="0.8"/><rect x="255" y="708" width="290" height="4" opacity="0.7"/><rect x="285" y="728" width="230" height="3" opacity="0.6"/><rect x="275" y="750" width="250" height="3" opacity="0.5"/><rect x="315" y="774" width="170" height="3" opacity="0.42"/><rect x="305" y="802" width="190" height="2" opacity="0.34"/><rect x="345" y="834" width="110" height="2" opacity="0.26"/><rect x="335" y="870" width="130" height="2" opacity="0.2"/><rect x="370" y="912" width="60" height="2" opacity="0.14"/></g>
    <path d="M0 1000 L0 930 L800 890 L800 1000 Z" fill="#07110D"/>
    <path d="M0 930 L800 890" stroke="#F3EFE4" stroke-width="1" opacity="0.3"/>
    <rect width="800" height="1000" filter="url(#portrait-grain)" opacity="0.27"/>
  </g>
</svg>
