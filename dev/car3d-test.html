<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car 3D test</title>
<style>
  html, body { margin: 0; height: 100%; background: #07110D; color: #F3EFE4; font: 12px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .panel { position: fixed; left: 12px; bottom: 12px; padding: 10px 12px; background: rgba(0,0,0,.55); border: 1px solid rgba(243,239,228,.2); border-radius: 8px; display: grid; gap: 6px; width: min(340px, calc(100vw - 48px)); z-index: 2; }
  label { display: grid; grid-template-columns: 70px 1fr 40px; gap: 8px; align-items: center; }
  input[type=range] { width: 100%; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .hs { position: fixed; left: 0; top: 0; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #FFDF00; box-shadow: 0 0 0 3px rgba(255,223,0,.25); pointer-events: none; z-index: 1; transition: opacity .2s; }
  .hs span { position: absolute; left: 14px; top: -4px; white-space: nowrap; font-size: 11px; color: #F3EFE4; text-shadow: 0 1px 2px #000; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="panel">
  <label>progress <input id="p" type="range" min="0" max="1" step="0.001" value="0.1"><output id="po">0.1</output></label>
  <label>velocity <input id="v" type="range" min="-1" max="1" step="0.01" value="0"><output id="vo">0</output></label>
  <div class="row">
    <span><input id="hsOn" type="checkbox" checked> hotspots</span>
    <span><input id="rm" type="checkbox"> reduced motion (reloads)</span>
    <span id="status"></span>
  </div>
</div>
<script type="module">
  import { createCar3D } from '../js/car3d.js';

  const $ = (id) => document.getElementById(id);
  const qs = new URLSearchParams(location.search);
  const reducedMotion = qs.has('rm');
  $('rm').checked = reducedMotion;
  $('rm').addEventListener('change', (e) => { location.search = e.target.checked ? '?rm' : ''; });

  const car = createCar3D($('c'), { reducedMotion });
  window.car = car;
  $('status').textContent = car.failed ? 'WebGL failed' : `${(car.triangles / 1000).toFixed(0)}k tris`;

  const p0 = qs.has('p') ? +qs.get('p') : 0.1;
  $('p').value = p0; $('po').value = p0;
  car.setProgress(p0);
  $('p').addEventListener('input', (e) => { car.setProgress(+e.target.value); $('po').value = (+e.target.value).toFixed(3); });
  $('v').addEventListener('input', (e) => { car.setVelocity(+e.target.value); $('vo').value = (+e.target.value).toFixed(2); });
  addEventListener('pointermove', (e) => car.setPointer((e.clientX / innerWidth) * 2 - 1, (e.clientY / innerHeight) * 2 - 1));
  addEventListener('resize', () => car.resize());

  const dots = car.hotspots.map((h) => {
    const d = document.createElement('div');
    d.className = 'hs';
    d.innerHTML = `<span>${h.label}</span>`;
    document.body.appendChild(d);
    return [h, d];
  });
  function tick() {
    const on = $('hsOn').checked;
    for (const [h, d] of dots) {
      const s = h.getScreen();
      d.style.transform = `translate(${s.x}px, ${s.y}px)`;
      d.style.opacity = on && s.visible ? 1 : 0;
    }
    requestAnimationFrame(tick);
  }
  tick();
  car.start();
</script>
</body>
</html>
