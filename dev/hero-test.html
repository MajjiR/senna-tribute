<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero scene test</title>
<style>
  html, body { margin: 0; height: 100%; background: #07110D; color: #F3EFE4; font: 12px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .bg { position: fixed; inset: 0; display: grid; place-items: center; font-size: 17vw; font-weight: 800; letter-spacing: -0.04em; color: #F3EFE4; opacity: .9; white-space: nowrap; }
  .panel { position: fixed; left: 12px; bottom: 12px; padding: 10px 12px; background: rgba(0,0,0,.55); border: 1px solid rgba(243,239,228,.2); border-radius: 8px; display: grid; gap: 6px; width: min(340px, calc(100vw - 48px)); }
  label { display: grid; grid-template-columns: 70px 1fr 40px; gap: 8px; align-items: center; }
  input[type=range] { width: 100%; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div class="bg" id="bg" hidden>AYRTON SENNA</div>
<canvas id="c"></canvas>
<div class="panel">
  <label>progress <input id="p" type="range" min="0" max="1" step="0.001" value="0"><output id="po">0</output></label>
  <label>velocity <input id="v" type="range" min="-1" max="1" step="0.01" value="0"><output id="vo">0</output></label>
  <label>intro <input id="i" type="range" min="0" max="1" step="0.001" value="1"><output id="io">1</output></label>
  <div class="row">
    <span><input id="text" type="checkbox"> headline behind</span>
    <span><input id="rm" type="checkbox"> reduced motion (reloads)</span>
    <span id="status"></span>
  </div>
</div>
<script type="module">
  import { createHeroScene } from '../js/hero-scene.js';

  const $ = (id) => document.getElementById(id);
  const reducedMotion = new URLSearchParams(location.search).has('rm');
  $('rm').checked = reducedMotion;
  $('rm').addEventListener('change', (e) => { location.search = e.target.checked ? '?rm' : ''; });
  $('text').addEventListener('change', (e) => { $('bg').hidden = !e.target.checked; });

  const scene = createHeroScene($('c'), { reducedMotion });
  $('status').textContent = scene.failed ? 'WebGL failed (no-op scene)' : 'ok';
  window.heroScene = scene;

  const bind = (id, out, fn) => {
    const el = $(id);
    const apply = () => {
      const val = parseFloat(el.value);
      $(out).textContent = val.toFixed(2);
      fn(val);
      if (reducedMotion) scene.renderOnce();
    };
    el.addEventListener('input', apply);
    apply();
  };
  bind('p', 'po', (x) => scene.setProgress(x));
  bind('v', 'vo', (x) => scene.setVelocity(x));
  bind('i', 'io', (x) => scene.setIntro(x));
  // velocity springs back like real scrolling when released
  $('v').addEventListener('change', () => { $('v').value = 0; $('v').dispatchEvent(new Event('input')); });

  addEventListener('pointermove', (e) => {
    scene.setPointer((e.clientX / innerWidth) * 2 - 1, (e.clientY / innerHeight) * 2 - 1);
  });
  addEventListener('resize', () => { scene.resize(); if (reducedMotion) scene.renderOnce(); });

  if (reducedMotion) scene.renderOnce();
  else scene.start();
</script>
</body>
</html>
