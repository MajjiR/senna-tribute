<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story sequence test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/story.css">
<style>
  .t-spacer { height: 100vh; display: grid; place-items: center; font: 500 12px/1.4 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; opacity: .5; }
  .t-ctrl { position: fixed; left: 12px; top: 12px; z-index: 99; font: 11px var(--f-mono); background: rgba(0,0,0,.6); padding: 8px 10px; border-radius: 6px; display: flex; gap: 10px; }
</style>
</head>
<body>
<div class="t-ctrl"><label><input type="checkbox" id="rm"> reduced motion (reloads)</label><span id="status"></span></div>
<div class="t-spacer">Scroll ↓ — spacer above</div>
<section class="story" id="story" aria-label="The story"></section>
<div class="t-spacer">Spacer below</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>
<script type="module">
  import { initStory } from '../js/story.js';
  const { gsap, ScrollTrigger, Lenis } = window;
  gsap.registerPlugin(ScrollTrigger);
  const q = new URLSearchParams(location.search);
  const reducedMotion = q.has('rm') || matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rmBox = document.getElementById('rm');
  rmBox.checked = reducedMotion;
  rmBox.addEventListener('change', (e) => { location.search = e.target.checked ? '?rm' : ''; });
  if (reducedMotion) document.documentElement.classList.add('rm');

  let vel = 0;
  let lenis = null;
  if (!reducedMotion && Lenis && !q.has('nolenis')) {
    lenis = new Lenis({ lerp: 0.09, smoothWheel: true, wheelMultiplier: 0.9 });
    lenis.on('scroll', ScrollTrigger.update);
    gsap.ticker.add((t) => {
      lenis.raf(t * 1000);
      vel += (Math.max(-1, Math.min(1, (lenis.velocity || 0) / 40)) - vel) * 0.1;
    });
    gsap.ticker.lagSmoothing(0);
  }
  const story = initStory(document.getElementById('story'), { gsap, ScrollTrigger, reducedMotion, getVelocity: () => vel });
  window.__story = story;
  window.__lenis = lenis;
  document.getElementById('status').textContent = reducedMotion ? 'static' : 'pinned';
</script>
</body>
</html>
